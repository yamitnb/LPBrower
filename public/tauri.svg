<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#06B6D4" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="pGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#D946EF"/>
    </linearGradient>
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="#0A0E17"/>
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGlow)"/>
  <rect x="24" y="24" width="464" height="464" rx="108" stroke="url(#rimGrad)" stroke-width="4"/>

  <!-- Cyber grid lines -->
  <line x1="24" y1="256" x2="488" y2="256" stroke="#1E293B" stroke-width="1" stroke-dasharray="4 8" opacity="0.4"/>
  <line x1="256" y1="24" x2="256" y2="488" stroke="#1E293B" stroke-width="1" stroke-dasharray="4 8" opacity="0.4"/>
  <circle cx="256" cy="256" r="180" stroke="#1E293B" stroke-width="1" stroke-dasharray="6 10" opacity="0.3"/>

  <!-- Glowing Aura Behind Mark -->
  <g filter="url(#glowEffect)" opacity="0.6">
    <path d="M124 136 C124 125 133 116 144 116 H172 C183 116 192 125 192 136 V340 H252 C263 340 272 349 272 360 V376 C272 387 263 396 252 396 H144 C133 396 124 387 124 376 Z" fill="url(#shieldGrad)" />
    <path fill-rule="evenodd" clip-rule="evenodd" d="M228 136 C228 125 237 116 248 116 H316 C368 116 408 152 408 206 C408 260 368 296 316 296 H296 V376 C296 387 287 396 276 396 H248 C237 396 228 387 228 376 V136 Z M296 176 V236 H316 C336 236 348 224 348 206 C348 188 336 176 316 176 H296 Z" fill="url(#pGrad)" />
  </g>

  <!-- "L" Shield Angle -->
  <path d="M124 136 C124 125 133 116 144 116 H172 C183 116 192 125 192 136 V340 H252 C263 340 272 349 272 360 V376 C272 387 263 396 252 396 H144 C133 396 124 387 124 376 Z" fill="url(#shieldGrad)" />

  <!-- "P" Browser Loop -->
  <path fill-rule="evenodd" clip-rule="evenodd" d="M228 136 C228 125 237 116 248 116 H316 C368 116 408 152 408 206 C408 260 368 296 316 296 H296 V376 C296 387 287 396 276 396 H248 C237 396 228 387 228 376 V136 Z M296 176 V236 H316 C336 236 348 224 348 206 C348 188 336 176 316 176 H296 Z" fill="url(#pGrad)" />

  <!-- Central Antidetect Radar Core -->
  <circle cx="316" cy="206" r="22" fill="#0A0E17"/>
  <circle cx="316" cy="206" r="22" stroke="#00F2FE" stroke-width="4"/>
  <circle cx="316" cy="206" r="9" fill="#00F2FE"/>

  <!-- High-tech light accent -->
  <path d="M124 136 L192 116 L272 360 L228 396 Z" fill="white" opacity="0.05"/>
</svg>
