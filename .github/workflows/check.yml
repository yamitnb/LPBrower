name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm --prefix ui-kit ci
      - run: |
          node -e '
            const fs = require("fs");
            for (const p of ["ui-kit/node_modules/estree-walker/package.json", "node_modules/estree-walker/package.json"]) {
              if (!fs.existsSync(p)) continue;
              const j = JSON.parse(fs.readFileSync(p, "utf8"));
              if (j.exports && !j.exports["."] && (j.exports.require || j.exports.import)) {
                j.exports = { ".": { default: j.main || j.exports.require, ...j.exports }, "./package.json": "./package.json" };
                fs.writeFileSync(p, JSON.stringify(j, null, 2));
              }
            }
          '
      # tsc resolves the kit's types from its build output.
      - run: npm run build:ui-kit
      - run: npx tsc --noEmit
